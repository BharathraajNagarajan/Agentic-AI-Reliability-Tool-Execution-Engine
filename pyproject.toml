[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-reliability-tool-execution-engine"
version = "0.0.1"
description = "Support-ticket ops agent: LLM proposes actions, a deterministic layer authorizes, validates, executes, and verifies them."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "langgraph",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["src*"]
